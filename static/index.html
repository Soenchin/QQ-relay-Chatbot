<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f5f2">
    <title>QQ Bot Relay - WebUI</title>
    <link rel="stylesheet" href="static/app.css">
    <script src="static/ui.js" defer></script>
    <script src="static/logs.js" defer></script>
    <script src="static/relay-control.js" defer></script>
    <script src="static/app.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#content">跳到主要内容</a>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M8 8h7v7H8zM17 17h7v7h-7zM11.5 15v5.5H17M20.5 8v6M17.5 11h6" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg></div>
            <div><h1>QQ Bot Relay</h1><p>机器人控制台</p></div>
        </div>
        <div class="nav-caption">工作空间</div>
        <nav class="sidebar-nav" id="nav" aria-label="主要导航">
            <a class="nav-item active" data-view="dashboard" data-icon="dashboard" href="#/dashboard">仪表盘</a>
            <a class="nav-item" data-view="group-config" data-icon="settings" href="#/group-config">群设置</a>
            <a class="nav-item" data-view="pipe-status" data-icon="pipe" href="#/pipe-status">管道状态</a>
            <a class="nav-item" data-view="knowledge" data-icon="book" href="#/knowledge">知识库</a>
            <a class="nav-item" data-view="plugins" data-icon="plugin" href="#/plugins">插件管理</a>
            <a class="nav-item" data-view="settings" data-icon="settings" href="#/settings">连接与配置</a>
            <a class="nav-item" data-view="logs" data-icon="logs" href="#/logs">运行日志</a>
        </nav>
        <div class="sidebar-footer">
            <div class="connection-status"><span class="status-dot offline" id="statusDot"></span><span class="status-text" id="statusText">未连接</span></div>
            <button class="btn btn-outline btn-sm btn-block" id="btn-reload-global">重载人设</button>
            <p>QQ Bot Relay · 本地控制台</p>
        </div>
    </aside>
    <main class="main-content" id="content" tabindex="-1">
        <div class="workspace-bar"><span>工作空间 <span class="breadcrumb-separator">/</span> <span id="current-page">仪表盘</span></span><span class="workspace-note">让对话自然发生</span></div>
        <section class="relay-controls" aria-label="中继启停管理">
            <div class="relay-summary"><strong id="relay-phase">读取状态中</strong><p id="relay-message" role="status"></p><details><summary>数据位置</summary><p>配置根目录：<span id="relay-data-dir"></span></p><p>知识与对话：<span id="relay-memory-dir"></span></p></details></div>
            <div class="relay-actions"><button class="btn btn-primary btn-sm" id="relay-start" disabled>启动中继</button><button class="btn btn-outline btn-sm" id="relay-stop" disabled>停止</button><button class="btn btn-outline btn-sm" id="relay-restart" disabled>重启中继</button></div>
            <p id="relay-action-error" role="alert"></p>
        </section>
        <div id="app-view"><div class="loading">加载中</div></div>
    </main>
</body>
</html>
